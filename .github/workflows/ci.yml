# NexaCart CI quality gates (TEST-001).
#
# Jobs (all run in parallel; `ci-gate` is the single status to require in branch protection):
#   python-quality  Ruff lint, Ruff format check, Mypy
#   backend-tests   unit + API tests (no database)
#   frontend        ESLint, Prettier check, TypeScript check, production build
#   postgres-verify disposable PostgreSQL 16 (Compose `db-test` service): database/integration
#                   tests, explicit Alembic migration, deterministic seed + verify, and a real
#                   readiness smoke test against the running API process
#   ci-gate         fails unless every job above succeeded
#
# Security: read-only token, no secrets used. Database and seed passwords are generated per run,
# masked, and never written to artifacts. Third-party actions are pinned to full commit SHAs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  python-quality:
    name: Python lint, format and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies
        run: python -m pip install -e ".[dev,test]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

  backend-tests:
    name: Backend unit and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies
        run: python -m pip install -e ".[dev,test]"

      - name: Run unit and API tests (no database)
        run: |
          mkdir -p reports
          pytest -m "unit or api" --junitxml=reports/pytest-unit-api.xml

      - name: Assert tests were executed, not skipped
        run: python scripts/ci/assert_junit_executed.py reports/pytest-unit-api.xml --min-tests 1

  frontend:
    name: Frontend lint, format, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

  postgres-verify:
    name: PostgreSQL migration, seed and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies
        run: python -m pip install -e ".[dev,test]"

      # Random per-run credentials for a database that exists only for this job. They are masked
      # before being stored so they cannot appear in logs; nothing here is a repository secret.
      - name: Create throwaway database and seed credentials
        run: |
          set -euo pipefail
          mkdir -p reports
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::${db_password}"
          {
            echo "POSTGRES_USER=nexacart_ci"
            echo "POSTGRES_PASSWORD=${db_password}"
            echo "POSTGRES_DB=nexacart"
            echo "POSTGRES_TEST_DB=nexacart_test"
          } >> "$GITHUB_ENV"
          for name in ADMIN CUSTOMER HISTORY REVIEWER; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::${value}"
            echo "SEED_PASSWORD_${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: Start disposable PostgreSQL 16 (Compose db-test service)
        run: |
          set -euo pipefail
          docker compose --profile test up -d --wait db-test
          # Destructive owner database tests get their own empty database; the seed/readiness
          # steps use the Compose default `nexacart_test` (the only database the seed allows).
          docker compose --profile test exec -T db-test \
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_TEST_DB" \
            -c 'CREATE DATABASE nexacart_ci_test'
          docker compose --profile test exec -T db-test \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_TEST_DB" -Atc 'SELECT version()'

      - name: PostgreSQL-backed database and integration tests
        env:
          ALLOW_DESTRUCTIVE_TEST_DB: "1" # target is the empty, disposable nexacart_ci_test
        run: |
          set -euo pipefail
          base="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:55432"
          export TEST_DATABASE_URL="${base}/nexacart_ci_test"
          export NEXACART_TEST_DATABASE_URL="${base}/nexacart_ci_test"
          pytest -m "database or integration" --junitxml=reports/pytest-database.xml
          python scripts/ci/assert_junit_executed.py reports/pytest-database.xml --min-tests 1

      - name: Apply Alembic migrations (explicit step)
        env:
          APP_ENV: test
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:55432/${POSTGRES_TEST_DB}"
          alembic upgrade head
          alembic current 2>&1 | tee reports/alembic-current.txt
          grep -q "(head)" reports/alembic-current.txt
          docker compose --profile test exec -T db-test \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_TEST_DB" -Atc \
            "SELECT count(*) || ' public tables' FROM information_schema.tables WHERE table_schema = 'public'"

      - name: Seed the disposable database and verify the baseline
        env:
          APP_ENV: test
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:55432/${POSTGRES_TEST_DB}"
          python -m app.seed seed
          python -m app.seed verify --snapshot > reports/seed-verify-1.json
          python -m app.seed assets --check
          # Repeatability (NFR-008): a second run needs no passwords and must change nothing.
          env -u SEED_PASSWORD_ADMIN -u SEED_PASSWORD_CUSTOMER \
            -u SEED_PASSWORD_HISTORY -u SEED_PASSWORD_REVIEWER python -m app.seed seed
          python -m app.seed verify --snapshot > reports/seed-verify-2.json
          cmp reports/seed-verify-1.json reports/seed-verify-2.json
          echo "Seed verify output is identical after a second seed run."

      - name: Readiness smoke test against the real API process
        env:
          APP_ENV: test
        run: |
          set -euo pipefail
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          export DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:55432/${POSTGRES_TEST_DB}"

          # 1) Healthy database: /health/ready must return 200 only after a database round-trip.
          python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 \
            > reports/api-ready.log 2>&1 &
          python scripts/ci/readiness_smoke.py --base-url http://127.0.0.1:8000 --expect ready

          # 2) Negative control: the process is up but the database is unreachable (closed port),
          #    so readiness must be 503 NOT_READY. Proves readiness is not just "process started".
          DATABASE_URL="postgresql+psycopg://nobody:not-a-secret@127.0.0.1:9/${POSTGRES_TEST_DB}" \
            python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8001 \
            > reports/api-not-ready.log 2>&1 &
          python scripts/ci/readiness_smoke.py --base-url http://127.0.0.1:8001 --expect not-ready

      - name: Collect and redact diagnostics
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p reports
          docker compose --profile test logs --no-color db-test > reports/db-test.log 2>&1 || true
          for file in reports/*; do
            [ -f "$file" ] || continue
            for secret in "${POSTGRES_PASSWORD:-}" "${SEED_PASSWORD_ADMIN:-}" "${SEED_PASSWORD_CUSTOMER:-}" \
              "${SEED_PASSWORD_HISTORY:-}" "${SEED_PASSWORD_REVIEWER:-}"; do
              [ -n "$secret" ] && sed -i "s|${secret}|***|g" "$file"
            done
          done
          true

      - name: Upload diagnostics (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-verify-diagnostics
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop and remove the disposable database
        if: always()
        run: docker compose --profile test down -v --remove-orphans

  ci-gate:
    name: CI gate
    if: always()
    needs: [python-quality, backend-tests, frontend, postgres-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality gate to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required quality gate did not succeed (${result})."
              exit 1
            fi
          done
