[project]
name = "nexacart"
version = "0.0.0"
description = "NexaCart e-commerce application (FastAPI backend and worker) with its SDET automation suite."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.156.8",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.1",
    "SQLAlchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
]
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pytest-playwright==0.10.0",
    "pytest-bdd==9.0.0",
    "allure-pytest==2.16.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Assertions and synthetic credentials are expected in tests.
"tests/**" = ["S101", "S105", "S106"]
# Alembic revision boilerplate (unused op/sa imports in empty revisions, blank Revises line).
"migrations/versions/*.py" = ["F401", "I001", "W291"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["allure.*", "pytest_bdd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: backend unit/service tests (no browser, no database)",
    "api: HTTPX/REST contract and behaviour tests",
    "ui: Playwright browser tests",
    "integration: cross-component workflow tests",
    "database: SQL/persistence assertions against PostgreSQL",
    "bdd: pytest-bdd business scenarios",
]
